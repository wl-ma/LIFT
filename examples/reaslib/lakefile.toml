name = "lift_reaslib_examples"
version = "0.1.0"
defaultTargets = ["ReasLib", "NocedalNumericalOptimization", "RiemannSurfaces"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "81a5d257c8e410db227a6665ed08f64fea08e997"

[[lean_lib]]
name = "ReasLib"

[[lean_lib]]
name = "NocedalNumericalOptimization"
globs = ["NocedalNumericalOptimization.+"]

[[lean_lib]]
name = "RiemannSurfaces"
globs = ["RiemannSurfaces.+"]
