name = "lift_normal_cone"
version = "0.1.0"
defaultTargets = ["SourceRecovery", "Audit"]
[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "81a5d257c8e410db227a6665ed08f64fea08e997"
[[lean_lib]]
name = "ReasLib"
globs = ["ReasLib.*"]
[[lean_lib]]
name = "SourceRecovery"
[[lean_lib]]
name = "Audit"
