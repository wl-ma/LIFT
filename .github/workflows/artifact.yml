name: Artifact verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  LEAN_NUM_THREADS: "1"
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff -r requirements-plots.txt
      - run: |
          python scripts/verify_release.py
          python scripts/verify_artifacts.py
          python scripts/reproduce_tables.py --check
          python scripts/plot_results.py --output _runs/figures
          python -m unittest discover -s tests -v
          ruff check src scripts tools tests
          ruff format --check src scripts tools tests
      - uses: actions/upload-artifact@v4
        with:
          name: recomputed-figures
          path: _runs/figures
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - project: examples/paper-cases/reaslib
            case: reaslib
          - project: examples/paper-cases/normal-cone
            case: normal-cone
          - project: examples/paper-cases/beck/checkpoint
            case: beck
          - project: examples/reaslib-serial
            case: serial
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ${{ matrix.project }}
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Fresh project compilation and exact axiom/client checks
        shell: bash
        run: |
          if [ "${{ matrix.case }}" = "reaslib" ]; then
            python3 scripts/check_lean.py --output _runs/ci-reaslib
          elif [ "${{ matrix.case }}" = "serial" ]; then
            python3 scripts/check_serial_demo.py --output _runs/ci-serial
            for project in experiments/serial-library-growth/supplementary/*/project; do
              mkdir -p "$project/.lake"
              ln -s "$GITHUB_WORKSPACE/examples/reaslib-serial/.lake/packages" "$project/.lake/packages"
            done
            python3 scripts/check_serial_cases.py --output _runs/ci-serial-cases
          else
            python3 scripts/check_case.py "${{ matrix.case }}" --output "_runs/ci-${{ matrix.case }}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-${{ matrix.case }}
          path: _runs/ci-*
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: examples/lean-json
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
      - run: python3 scripts/validate_tools.py --output _runs/ci-tools
      - run: python3 scripts/validate_workflows.py --output _runs/ci-workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tools-compiler-and-migration
          path: _runs/ci-tools
